<!doctype html>
<!--
  Link-preview card (1200×630) of capsule.ai.kr: the login screen's 「노트북 앞에서 조는 채린」 scene, the CAPSULE logo and
  「나만의 메이트가 기다리고 있어요」. Rendered by scripts/og/render-og-images.mjs into public/og/. `?variant=invite` adds the
  「친구 초대」 badge and the reward line (the fixed image of invite links, server/og-meta.ts).
  The scene (Chaerin, laptop, mug, desk) is a screenshot of the login stage (DozeMateStage / DozeDesk) that the render
  script hands over as window.OG_SCENE, so it matches the login screen exactly; this file only adds the room behind it,
  the scrim and the copy. Only repository assets otherwise (relative paths); no 「AI 캐릭터」 tag here (PM 2026-11-26:
  the tag stays on the login screen).
-->
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>CAPSULE OG card</title>
<style>
  @font-face {
    font-family: 'Pretendard';
    font-weight: 100 900;
    src: url('../../src/assets/brand/PretendardVariable.woff2') format('woff2');
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0f0e17; }
  body { font-family: 'Pretendard', sans-serif; color: #fafafd; -webkit-font-smoothing: antialiased; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; isolation: isolate; }
  .room {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 30% 40%;
    filter: blur(6px) brightness(0.62) saturate(1.1); transform: scale(1.06);
  }
  .scene { position: absolute; max-width: none; user-select: none; }
  .scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(15, 14, 23, 0) 34%, rgba(15, 14, 23, 0.7) 56%, rgba(15, 14, 23, 0.92) 100%),
      linear-gradient(0deg, rgba(15, 14, 23, 0.5) 0%, rgba(15, 14, 23, 0) 24%);
  }

  .copy {
    position: absolute; left: 690px; top: 0; bottom: 0; width: 460px;
    display: flex; flex-direction: column; justify-content: center; gap: 26px;
  }
  .logo { width: 272px; height: auto; display: block; }
  h1 { font-size: 54px; line-height: 1.24; font-weight: 800; letter-spacing: -0.02em; word-break: keep-all; }
  .sub { font-size: 25px; line-height: 1.45; color: #cac9d4; font-weight: 500; word-break: keep-all; }
  .sub strong { color: #fafafd; font-weight: 700; }
  .domain { position: absolute; left: 690px; bottom: 44px; font-size: 20px; color: #a4a3b0; font-weight: 600; letter-spacing: 0.02em; }

  /* 「친구 초대」: a small pixel tag (stepped corners cut with clip-path, no outline). Neutral surface: not an action. */
  .badge {
    align-self: flex-start; display: none; align-items: center; gap: 12px;
    padding: 12px 22px 12px 18px; background: #403e4b; color: #fafafd; font-size: 24px; font-weight: 800;
    clip-path: polygon(0 8px, 4px 8px, 4px 4px, 8px 4px, 8px 0, calc(100% - 8px) 0, calc(100% - 8px) 4px, calc(100% - 4px) 4px, calc(100% - 4px) 8px, 100% 8px,
      100% calc(100% - 8px), calc(100% - 4px) calc(100% - 8px), calc(100% - 4px) calc(100% - 4px), calc(100% - 8px) calc(100% - 4px), calc(100% - 8px) 100%,
      8px 100%, 8px calc(100% - 4px), 4px calc(100% - 4px), 4px calc(100% - 8px), 0 calc(100% - 8px));
  }
  .px { display: inline-block; background-size: 100% 100%; image-rendering: pixelated; flex: none; }
  .reward { display: none; align-items: center; gap: 12px; font-size: 26px; font-weight: 700; color: #fafafd; }
  .reward em { font-style: normal; color: #f4b95f; }
  [data-variant='invite'] .badge, [data-variant='invite'] .reward { display: inline-flex; }
  [data-variant='invite'] .sub-default { display: none; }
</style>
</head>
<body>
<div class="card" id="card">
  <img class="room" src="../../src/assets/characters/chaerin-call-bg/chaerin-call-bg-landscape.webp" alt="" />
  <img class="scene" id="scene" alt="" />
  <div class="scrim"></div>

  <div class="copy">
    <img class="logo" src="../../design/brand/capsule-logo-2026-11-22-v2/capsule-horizontal-color.svg" alt="CAPSULE" />
    <span class="badge"><span class="px" data-px="capsule" data-scale="3"></span>친구 초대</span>
    <h1>나만의 메이트가<br />기다리고 있어요</h1>
    <p class="sub sub-default">노트북 앞의 시간을 <strong>함께</strong> 보내요</p>
    <p class="reward"><span class="px" data-px="coin" data-scale="3"></span><span>함께 가입하면 둘 다 <em>1,000 크레딧</em></span></p>
  </div>
  <p class="domain">capsule.ai.kr</p>
</div>
<script>
  const params = new URLSearchParams(location.search)
  document.getElementById('card').dataset.variant = params.get('variant') === 'invite' ? 'invite' : 'default'

  // Pixel pictures from src/shared/ui/pixel/pixel-art.ts, handed over by the render script.
  for (const el of document.querySelectorAll('[data-px]')) {
    const art = (window.OG_PIXELS || {})[el.dataset.px]
    if (!art) { el.remove(); continue }
    const scale = Number(el.dataset.scale) || 3
    el.style.width = `${art.width * scale}px`
    el.style.height = `${art.height * scale}px`
    el.style.backgroundImage = art.url
  }

  // The login screen's stage (DozeMateStage + DozeDesk), captured by the render script; see render-og-images.mjs.
  const scene = window.OG_SCENE
  const sceneEl = document.getElementById('scene')
  if (scene) {
    Object.assign(sceneEl.style, { left: `${scene.left}px`, top: `${scene.top}px`, width: `${scene.width}px`, height: `${scene.height}px` })
    sceneEl.src = scene.url
  } else {
    sceneEl.remove()
  }
  document.fonts.ready.then(() => { document.body.dataset.ready = 'true' })
</script>
</body>
</html>
