<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hang-up handset render</title>
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<!-- Source of hangup-handset-3d.webp. See README.md in this folder for the render command. -->
<script type="module">
import * as THREE from 'three'
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js'

const SIZE = 640
const params = new URLSearchParams(location.search)
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1)
renderer.setSize(SIZE, SIZE)
renderer.setClearColor(0x000000, 0)
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 0.92
renderer.outputColorSpace = THREE.SRGBColorSpace
document.body.append(renderer.domElement)

const scene = new THREE.Scene()
const pmrem = new THREE.PMREMGenerator(renderer)
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
scene.environmentIntensity = 0.55

const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100)

// Soft key from upper-left, lilac rim from behind-right, faint fill.
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-3, 4, 5); scene.add(key)
const rim = new THREE.DirectionalLight(0xd9c8ff, 3.2); rim.position.set(4, -2, -3); scene.add(rim)
const fill = new THREE.DirectionalLight(0xb7a2ff, 0.6); fill.position.set(2, -3, 4); scene.add(fill)

const body = new THREE.MeshPhysicalMaterial({
  color: new THREE.Color(params.get('color') ?? '#6f45f0'),
  roughness: 0.38, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.08, sheen: 0.25, sheenColor: new THREE.Color('#cdb8ff'),
})
const grille = new THREE.MeshPhysicalMaterial({ color: new THREE.Color('#2a1d52'), roughness: 0.55, clearcoat: 0.4 })

// Built as the hung-up handset (handle on top, cups facing down), then turned to the upright 📞 pose.
const handset = new THREE.Group()

const curve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-1.22, -0.12, 0),
  new THREE.Vector3(-0.78, 0.22, 0),
  new THREE.Vector3(0, 0.34, 0),
  new THREE.Vector3(0.78, 0.22, 0),
  new THREE.Vector3(1.22, -0.12, 0),
])
const handle = new THREE.Mesh(new THREE.TubeGeometry(curve, 96, 0.33, 48, false), body)
handle.scale.set(1, 1, 0.9)
handset.add(handle)

// Cups: lathed domes at each end, angled slightly outward, with a recessed speaker face.
const profile = [
  [0, -0.2], [0.34, -0.2], [0.46, -0.16], [0.53, -0.08], [0.55, 0.02], [0.52, 0.14], [0.44, 0.27], [0.33, 0.38], [0.2, 0.45], [0, 0.48],
].map(([x, y]) => new THREE.Vector2(x, y))
const cupGeometry = new THREE.LatheGeometry(profile, 72)
const holeGeometry = new THREE.CircleGeometry(0.045, 20)
const holeMaterial = new THREE.MeshBasicMaterial({ color: '#120b26' })
for (const side of [-1, 1]) {
  const cup = new THREE.Group()
  cup.add(new THREE.Mesh(cupGeometry, body))
  const face = new THREE.Mesh(new THREE.CircleGeometry(0.33, 48), grille)
  face.rotation.x = Math.PI / 2
  face.position.y = -0.201
  cup.add(face)
  for (const [hx, hz] of [[0, 0], [0.13, 0], [-0.13, 0], [0, 0.13], [0, -0.13], [0.09, 0.09], [-0.09, 0.09], [0.09, -0.09], [-0.09, -0.09]]) {
    const hole = new THREE.Mesh(holeGeometry, holeMaterial)
    hole.rotation.x = Math.PI / 2
    hole.position.set(hx, -0.203, hz)
    cup.add(hole)
  }
  cup.position.set(side * 1.3, -0.3, 0)
  cup.rotation.z = side * 0.22
  handset.add(cup)
}

// Tilt the cups toward the viewer so the speaker faces read, then turn upright (the CSS motion turns it back by 135°).
const tilt = new THREE.Group(); tilt.add(handset); tilt.rotation.x = -0.55; tilt.rotation.y = 0.12
const pose = new THREE.Group(); pose.add(tilt); pose.rotation.z = THREE.MathUtils.degToRad(Number(params.get('angle') ?? 135))
scene.add(pose)

const box = new THREE.Box3().setFromObject(pose)
pose.position.sub(box.getCenter(new THREE.Vector3()))
const size = box.getSize(new THREE.Vector3())
camera.position.set(0, 0, (Math.max(size.x, size.y) / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.18)

renderer.render(scene, camera)
document.title = 'rendered'
</script>
</body>
</html>
